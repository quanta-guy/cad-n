[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-n"
version = "0.6.0"
description = "CAD-N - 2D true-shape nesting tool for DXF parts on rectangular sheet stock"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "quanta-guy" }]
keywords = ["nesting", "dxf", "cnc", "cad", "sheet-metal", "packing", "true-shape"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Manufacturing",
]
dependencies = [
    "PySide6==6.12.0",
    "ezdxf==1.4.4",
    "shapely==2.2.0",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "matplotlib==3.11.2", "pillow==12.3.0", "pyinstaller==6.22.3"]

[project.gui-scripts]
cad-n = "cad_n.main:main"

[tool.setuptools.packages.find]
include = ["cad_n*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.cad_n]
# Build-time metadata consumed by the version banner and packaging scripts.
app_name = "CAD-N"
